<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Luckiest Guy"; src: url(LuckiestGuy-400.woff2) format("woff2"); }
@font-face { font-family: "Fredoka"; src: url(Fredoka-700.woff2) format("woff2"); font-weight: 300 700; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1a0306; }
</style>
<script src="art.js"></script>
</head><body>
<script>
seed = 23;
let s = "";
s += `<defs>
  <radialGradient id="bg" cx="0.58" cy="0.5" r="0.75"><stop offset="0" stop-color="#8a0f2a"/><stop offset="0.45" stop-color="#3d0614"/><stop offset="1" stop-color="#12020a"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbd0"/><stop offset="0.45" stop-color="#ffd84a"/><stop offset="1" stop-color="#ff9a00"/></linearGradient>
  <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2d3d" stop-opacity="0"/><stop offset="0.5" stop-color="#ff5a5a" stop-opacity="0.85"/><stop offset="1" stop-color="#ff2d3d" stop-opacity="0"/></linearGradient>
  <linearGradient id="rainbowText" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a5a"/><stop offset="0.25" stop-color="#ffd24a"/><stop offset="0.5" stop-color="#5aff8a"/><stop offset="0.75" stop-color="#5ac8ff"/><stop offset="1" stop-color="#c85aff"/></linearGradient>
</defs>`;
s += `<rect width="1920" height="1080" fill="url(#bg)"/>`;
const cx = 1150, cy = 560;
s += rays(cx, cy, 28, 1500, "#ff4a5e", 0.13, 0.09);
s += rays(cx, cy, 14, 1500, "#ffd24a", 0.08, 0.05);
for (let i = 0; i < 60; i++) s += sparkle(rnd() * 1920, rnd() * 1080, 3 + rnd() * 9, rnd() < 0.5 ? "#ffd8a0" : "#ff9aa6", 0.25 + rnd() * 0.6);
// light pillar
s += `<rect x="${cx - 120}" y="-20" width="240" height="${cy + 40}" fill="url(#pillar)" filter="url(#blur20)"/>`;
s += `<rect x="${cx - 40}" y="-20" width="80" height="${cy}" fill="url(#pillar)"/>`;
// orbit ring + orbs (back half)
const orbit = (front) => {
  let o = "";
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + 0.4;
    const ox = cx + Math.cos(a) * 330, oy = cy + 40 + Math.sin(a) * 90;
    if ((Math.sin(a) > 0) !== front) continue;
    const col = ["#ff3b3b", "#ffd24a", "#3bff7a", "#3bc8ff", "#c33bff", "#ffffff"][i];
    o += `<circle cx="${ox}" cy="${oy}" r="34" fill="${col}" opacity="0.5" filter="url(#blur8)"/><circle cx="${ox}" cy="${oy}" r="17" fill="${col}" stroke="#fff" stroke-width="4"/>`;
  }
  return o;
};
s += `<ellipse cx="${cx}" cy="${cy + 40}" rx="330" ry="90" fill="none" stroke="#ffd24a" stroke-width="6" opacity="0.35"/>`;
s += orbit(false);
// the Admin donut
s += donut({ x: cx, y: cy, r: 235, frosting: "#ffffff", dough: "#e39a55", rainbow: true, rainbowOpacity: 0.85, eyes: "cool", mouth: "grin", crown: true, halo: "#ffe36b", glow: "#ff3148", legs: true, shoes: "#ffd24a", sprinkles: ["#fff", "#ffe14d", "#4dd2ff", "#7dff6a", "#c34dff"] });
s += orbit(true);
for (const [dx, dy, sz] of [[-300, -260, 34], [290, -220, 26], [330, 160, 22], [-340, 140, 18], [0, -470, 24], [-180, -390, 14], [200, -400, 16]]) s += sparkle(cx + dx, cy + dy, sz, "#fff8d0");
// ADMIN tag on the donut
s += `<g transform="rotate(-6 ${cx} ${cy + 330})"><rect x="${cx - 150}" y="${cy + 292}" width="300" height="76" rx="18" fill="#ff1f3a" stroke="#fff" stroke-width="7"/></g>`;
s += title("ADMIN", { x: cx, y: cy + 355, size: 64, fill: "#fff", stroke: "#5a0010", sw: 12, rotate: -6, shadow: false });

// Headline
s += title("ONLY", { x: 90, y: 200, size: 96, fill: "#fff", anchor: "start", sw: 18, rotate: -4 });
s += title("1 IN", { x: 80, y: 380, size: 190, fill: "#fff", anchor: "start", sw: 28, rotate: -4 });
s += title("24,000", { x: 70, y: 580, size: 200, fill: "url(#gold)", anchor: "start", sw: 30, rotate: -4 });
for (const [i, line] of ["Can YOU find the", "ADMIN DONUT?"].entries())
  s += title(line, { x: 92, y: 690 + i * 78, size: i === 0 ? 58 : 72, fill: i === 0 ? "#ffe1e6" : "url(#rainbowText)", anchor: "start", sw: 13, rotate: -4, font: i === 0 ? "Fredoka" : "Luckiest Guy" });

// Rarity ladder (right side)
const tiers = [
  ["COMMON", "#9aa0ad", "#2b2f38"],
  ["RARE", "#3aa0ff", "#0b2a55"],
  ["LEGENDARY", "#ffc21a", "#5a3a00"],
  ["SECRET", "#1a1a1a", "#000"],
  ["ADMIN", "#ff1f3a", "#4a0010"],
];
const lx = 1580, ly0 = 930;
tiers.forEach(([name, col, dark], i) => {
  const y = ly0 - i * 118, top = i === tiers.length - 1;
  const w = top ? 300 : 270, h = top ? 92 : 78;
  if (top) s += `<rect x="${lx - 14}" y="${y - h - 14}" width="${w + 28}" height="${h + 28}" rx="30" fill="#ff1f3a" opacity="0.55" filter="url(#blur20)"/>`;
  s += `<rect x="${lx}" y="${y - h}" width="${w}" height="${h}" rx="22" fill="${col}" stroke="${top ? "#fff" : "#fff"}" stroke-width="${top ? 7 : 5}" opacity="${top ? 1 : 0.92}"/>`;
  s += title(name, { x: lx + w / 2, y: y - h / 2 + (top ? 20 : 17), size: top ? 56 : 44, fill: name === "SECRET" ? "url(#rainbowText)" : "#fff", stroke: dark, sw: 10, shadow: false });
  if (i < tiers.length - 1) s += `<path d="M${lx + w / 2} ${y - h - 8} l -16 -18 h 32 z" fill="#fff" opacity="0.7"/>`;
});
{
  const ay = ly0 - 4 * 118 - 46, ex = cx + 270, ey = cy - 170;
  s += `<path d="M${lx - 18} ${ay} Q ${lx - 110} ${ay - 30} ${ex + 26} ${ey + 8}" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="2 22"/>`;
  s += `<path d="M${ex} ${ey} l 44 -10 l -18 40 z" fill="#fff"/>`;
}

s += logo(90, 860, 0.8);
page(s);
</script>
</body></html>
