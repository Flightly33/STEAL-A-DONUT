<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Luckiest Guy"; src: url(LuckiestGuy-400.woff2) format("woff2"); }
@font-face { font-family: "Fredoka"; src: url(Fredoka-700.woff2) format("woff2"); font-weight: 300 700; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #120a2a; }
</style>
<script src="art.js"></script>
</head><body>
<script>
seed = 11;
let s = "";
// Night sky
s += `<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1560"/><stop offset="0.6" stop-color="#140b35"/><stop offset="1" stop-color="#0b0620"/></linearGradient>
  <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#9fb8ff" stop-opacity="0.55"/><stop offset="1" stop-color="#9fb8ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1c55"/><stop offset="1" stop-color="#150d30"/></linearGradient>
  <radialGradient id="skin" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#4a3a86"/><stop offset="1" stop-color="#1c133d"/></radialGradient>
  <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe066" stop-opacity="0.75"/><stop offset="1" stop-color="#ffe066" stop-opacity="0"/></linearGradient>
  <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff3b3b" stop-opacity="0.9"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></radialGradient>
  <linearGradient id="yellowText" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff59a"/><stop offset="1" stop-color="#ffb800"/></linearGradient>
</defs>`;
s += `<rect width="1920" height="1080" fill="url(#sky)"/>`;
s += `<circle cx="1500" cy="260" r="520" fill="url(#moon)"/>`;
for (let i = 0; i < 70; i++) s += sparkle(rnd() * 1920, rnd() * 520, 2 + rnd() * 5, "#fff", 0.25 + rnd() * 0.6);
// ground
s += `<path d="M0 760 Q 960 700 1920 760 L 1920 1080 L 0 1080 Z" fill="url(#ground)"/>`;
s += `<path d="M0 760 Q 960 700 1920 760" stroke="#6b54c9" stroke-width="4" fill="none" opacity="0.5"/>`;

// The giant sleeping guard (a big shadowy head with a cap and a mustache)
const gx = 1540, gy = 600, R = 400;
s += `<ellipse cx="${gx}" cy="${gy + R * 0.95}" rx="${R * 1.1}" ry="${R * 0.18}" fill="#000" opacity="0.4" filter="url(#blur20)"/>`;
s += `<ellipse cx="${gx + 40}" cy="${gy + R * 0.9}" rx="${R * 1.05}" ry="${R * 0.45}" fill="#241a4a" stroke="#0b0620" stroke-width="10"/>`; // shoulders
s += `<circle cx="${gx}" cy="${gy}" r="${R}" fill="url(#skin)" stroke="#0b0620" stroke-width="12"/>`;
s += `<path d="M${gx - R * 0.95} ${gy - R * 0.25} A ${R} ${R} 0 0 1 ${gx - R * 0.2} ${gy - R * 0.98}" stroke="#8fa8ff" stroke-width="10" fill="none" opacity="0.45" stroke-linecap="round"/>`; // rim light
// ear
s += `<ellipse cx="${gx - R * 0.98}" cy="${gy + R * 0.05}" rx="${R * 0.14}" ry="${R * 0.2}" fill="#2c2158" stroke="#0b0620" stroke-width="10"/>`;
// cap
s += `<path d="M${gx - R * 0.95} ${gy - R * 0.42} Q ${gx} ${gy - R * 1.45} ${gx + R * 0.95} ${gy - R * 0.42} Z" fill="#1d3a8a" stroke="#0b0620" stroke-width="12" stroke-linejoin="round"/>`;
s += `<rect x="${gx - R * 0.9}" y="${gy - R * 0.5}" width="${R * 1.8}" height="${R * 0.1}" rx="${R * 0.03}" fill="#12275e" stroke="#0b0620" stroke-width="8"/>`;
s += `<path d="M${gx - R * 0.78} ${gy - R * 0.4} Q ${gx} ${gy - R * 0.12} ${gx + R * 0.78} ${gy - R * 0.4} Z" fill="#0e1f4d" stroke="#0b0620" stroke-width="10" stroke-linejoin="round"/>`; // brim
s += `<path d="M${gx} ${gy - R * 0.98} l ${R * 0.12} ${R * 0.1} l ${-R * 0.03} ${R * 0.18} l ${-R * 0.09} ${R * 0.05} l ${-R * 0.09} ${-R * 0.05} l ${-R * 0.03} ${-R * 0.18} Z" fill="#ffd23a" stroke="#7a4a00" stroke-width="6" filter="url(#glow8)"/>`; // badge
// closed eye (left)
s += `<path d="M${gx - R * 0.55} ${gy - R * 0.08} Q ${gx - R * 0.38} ${gy + R * 0.06} ${gx - R * 0.2} ${gy - R * 0.08}" stroke="#0b0620" stroke-width="16" fill="none" stroke-linecap="round"/>`;
// opening eye (right): red glow + half-open lid
s += `<circle cx="${gx + R * 0.36}" cy="${gy - R * 0.05}" r="${R * 0.42}" fill="url(#eyeGlow)"/>`;
s += `<ellipse cx="${gx + R * 0.36}" cy="${gy - R * 0.04}" rx="${R * 0.17}" ry="${R * 0.09}" fill="#fff4b0" stroke="#0b0620" stroke-width="12"/>`;
s += `<circle cx="${gx + R * 0.33}" cy="${gy - R * 0.02}" r="${R * 0.06}" fill="#ff2020" filter="url(#glow8)"/>`;
s += `<path d="M${gx + R * 0.17} ${gy - R * 0.06} Q ${gx + R * 0.36} ${gy - R * 0.2} ${gx + R * 0.55} ${gy - R * 0.06}" stroke="#0b0620" stroke-width="16" fill="#241a4a" stroke-linecap="round"/>`;
s += `<path d="M${gx + R * 0.15} ${gy - R * 0.3} L ${gx + R * 0.58} ${gy - R * 0.2}" stroke="#0b0620" stroke-width="18" stroke-linecap="round"/>`; // angry brow
// nose + big mustache
s += `<ellipse cx="${gx - R * 0.02}" cy="${gy + R * 0.2}" rx="${R * 0.14}" ry="${R * 0.12}" fill="#3a2d6e" stroke="#0b0620" stroke-width="10"/>`;
s += `<path d="M${gx - R * 0.02} ${gy + R * 0.3} C ${gx - R * 0.25} ${gy + R * 0.22} ${gx - R * 0.55} ${gy + R * 0.32} ${gx - R * 0.62} ${gy + R * 0.52} C ${gx - R * 0.42} ${gy + R * 0.44} ${gx - R * 0.2} ${gy + R * 0.5} ${gx - R * 0.02} ${gy + R * 0.42} C ${gx + R * 0.16} ${gy + R * 0.5} ${gx + R * 0.38} ${gy + R * 0.44} ${gx + R * 0.58} ${gy + R * 0.52} C ${gx + R * 0.5} ${gy + R * 0.32} ${gx + R * 0.2} ${gy + R * 0.22} ${gx - R * 0.02} ${gy + R * 0.3} Z" fill="#6b5a4a" stroke="#0b0620" stroke-width="10" stroke-linejoin="round"/>`;
// Zzz
s += title("Z", { x: gx - R * 0.72, y: gy - R * 0.72, size: 120, fill: "#a9c4ff", stroke: "#0b0620", rotate: -12, sw: 16 });
s += title("z", { x: gx - R * 0.98, y: gy - R * 0.98, size: 90, fill: "#a9c4ff", stroke: "#0b0620", rotate: -18, sw: 14 });
s += title("z", { x: gx - R * 1.18, y: gy - R * 1.2, size: 64, fill: "#a9c4ff", stroke: "#0b0620", rotate: -24, sw: 12 });

// Glowing donut on a pedestal
const px = 1010, py = 830;
s += `<path d="M${px - 70} ${py - 60} L ${px + 70} ${py - 60} L ${px + 150} -40 L ${px - 150} -40 Z" fill="url(#beam)" opacity="0.8"/>`;
s += `<ellipse cx="${px}" cy="${py + 110}" rx="140" ry="28" fill="#000" opacity="0.45" filter="url(#blur8)"/>`;
s += `<rect x="${px - 95}" y="${py - 40}" width="190" height="150" fill="#6a5aa8" stroke="#1b0b2e" stroke-width="8"/>`;
s += `<ellipse cx="${px}" cy="${py + 110}" rx="95" ry="24" fill="#4b3d85" stroke="#1b0b2e" stroke-width="8"/>`;
s += `<rect x="${px - 91}" y="${py - 40}" width="182" height="146" fill="#6a5aa8"/>`;
s += `<ellipse cx="${px}" cy="${py - 40}" rx="95" ry="24" fill="#9d8ce0" stroke="#1b0b2e" stroke-width="8"/>`;
s += donut({ x: px, y: py - 150, r: 105, frosting: "#ffcf2e", dough: "#e8a45c", eyes: "shock", mouth: "o", glow: "#ffd23a", sprinkles: ["#ff4f9a", "#fff", "#38d0ff", "#8dff6a"] });
for (const [dx, dy, sz] of [[-150, -280, 26], [140, -250, 20], [170, -120, 14], [-170, -100, 16], [0, -330, 18]]) s += sparkle(px + dx, py + dy, sz, "#fff6b0");

// The sneaky player, tiptoeing in
s += `<ellipse cx="700" cy="1000" rx="120" ry="22" fill="#000" opacity="0.45" filter="url(#blur8)"/>`;
s += avatar({ x: 700, y: 995, s: 2.35, face: "sneaky", pose: { legBack: 22, legFront: -20, armFront: -95, armBack: 12, lean: 6 } });

// Headline
s += title("SHHH...", { x: 70, y: 175, size: 110, fill: "url(#yellowText)", anchor: "start", sw: 18, rotate: -3 });
s += title("DON'T WAKE", { x: 62, y: 345, size: 168, fill: "#ffffff", anchor: "start", sw: 26, rotate: -3 });
s += title("HIM!", { x: 62, y: 515, size: 168, fill: "#ff4f9a", anchor: "start", sw: 26, rotate: -3 });
for (const [i, line] of ["Steal the donut.", "Outrun the giant guard."].entries())
  s += `<text x="${445}" y="${448 + i * 56}" font-family="Fredoka" font-weight="700" font-size="46" fill="#e8e2ff" stroke="#140b35" stroke-width="10" paint-order="stroke" stroke-linejoin="round" transform="rotate(-3 445 448)">${line}</text>`;

// Logo
s += logo(1440, 900, 0.82);
page(s);
</script>
</body></html>
