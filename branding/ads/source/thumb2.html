<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Luckiest Guy"; src: url(LuckiestGuy-400.woff2) format("woff2"); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #b35cff; }
</style>
<script src="art.js"></script>
<script src="art2.js"></script>
</head><body>
<script>
seed = 41;
let s = "";
s += `<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b3cff"/><stop offset="0.75" stop-color="#ff7ad9"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc2ec"/><stop offset="1" stop-color="#e67acb"/></linearGradient>
  <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2d3d" stop-opacity="0"/><stop offset="0.5" stop-color="#ff4d5a" stop-opacity="0.9"/><stop offset="1" stop-color="#ff2d3d" stop-opacity="0"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbd0"/><stop offset="0.45" stop-color="#ffd84a"/><stop offset="1" stop-color="#ff9a00"/></linearGradient>
</defs>`;
s += `<rect width="1920" height="1080" fill="url(#sky)"/>`;
const dx = 1320, dy = 530, R = 290;
s += sunburst(dx, dy, "#ffffff", 0.16);
for (let i = 0; i < 50; i++) s += sparkle(rnd() * 1920, rnd() * 700, 3 + rnd() * 8, "#fff", 0.3 + rnd() * 0.6);
// floor
s += `<path d="M0 800 C 500 760 1400 760 1920 800 L 1920 1080 L 0 1080 Z" fill="url(#floor)"/>`;
// pedestal
s += `<ellipse cx="${dx}" cy="1010" rx="260" ry="46" fill="#000" opacity="0.2" filter="url(#blur8)"/>`;
s += `<rect x="${dx - 210}" y="870" width="420" height="130" fill="#ffffff" stroke="#6a2a8a" stroke-width="8"/>`;
s += `<ellipse cx="${dx}" cy="1000" rx="210" ry="36" fill="#f0d4ff" stroke="#6a2a8a" stroke-width="8"/>`;
s += `<rect x="${dx - 206}" y="870" width="412" height="126" fill="#ffffff"/>`;
s += `<ellipse cx="${dx}" cy="870" rx="210" ry="36" fill="#ffe8ff" stroke="#6a2a8a" stroke-width="8"/>`;
// red light pillar
s += `<rect x="${dx - 190}" y="-20" width="380" height="900" fill="url(#pillar)" filter="url(#blur20)"/>`;
// the Admin donut
s += frontDonut({ x: dx, y: dy, R, frosting: "#ffffff", rainbow: true, glow: "#ff2d3d", crown: true });
s += `<ellipse cx="${dx}" cy="${dy - R * 1.52}" rx="${R * 0.5}" ry="${R * 0.12}" fill="none" stroke="#ffe36b" stroke-width="${R * 0.06}" filter="url(#glow8)"/>`;
for (const [ox, oy, sz] of [[-380, -260, 34], [380, -300, 28], [400, 200, 22], [-420, 120, 20]]) s += sparkle(dx + ox, dy + oy, sz, "#fff");
// ADMIN tag
s += `<g transform="rotate(-6 ${dx} 930)"><rect x="${dx - 170}" y="892" width="340" height="84" rx="20" fill="#ff1f3a" stroke="#fff" stroke-width="8"/></g>`;
s += title("ADMIN", { x: dx, y: 960, size: 72, fill: "#fff", stroke: "#5a0010", sw: 12, rotate: -6, shadow: false });
// tiny amazed player
s += `<ellipse cx="700" cy="1012" rx="105" ry="20" fill="#000" opacity="0.25" filter="url(#blur8)"/>`;
s += avatar({ x: 700, y: 1005, s: 1.75, face: "shock", colors: { head: "#ffd23a", torso: "#2f7bff", arms: "#ffd23a", legs: "#38c95a" }, pose: { armFront: -150, armBack: 30, headX: 3 } });

// text
s += rainbowTitle("ADMIN DONUT", { x: 60, y: 175, size: 150 });
s += title("ONLY 1 IN 24,000!", { x: 70, y: 295, size: 88, fill: "url(#gold)", stroke: "#5a1a00", anchor: "start", sw: 18 });
s += curvedArrow(830, 385, 1000, 520, -110, 32);
s += bangs(1810, 190, 160, 14);
page(s);
</script>
</body></html>
