<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#8be04a"/><stop offset="1" stop-color="#2f8f2a"/>
    </radialGradient>
    <linearGradient id="dough" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0bb73"/><stop offset="1" stop-color="#c47f3a"/>
    </linearGradient>
    <linearGradient id="icing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3dc"/><stop offset="1" stop-color="#ff5fae"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff27a"/><stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <mask id="hole"><rect width="512" height="512" fill="#fff"/><circle cx="256" cy="228" r="46" fill="#000"/></mask>
  </defs>
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>
  <g opacity=".18" fill="#fff">
    <circle cx="70" cy="80" r="40"/><circle cx="450" cy="120" r="55"/><circle cx="420" cy="440" r="45"/><circle cx="60" cy="400" r="30"/>
  </g>
  <!-- speed lines -->
  <g stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".75">
    <line x1="30" y1="190" x2="95" y2="190"/><line x1="20" y1="235" x2="85" y2="235"/><line x1="38" y1="280" x2="98" y2="280"/>
  </g>
  <g transform="translate(0,-28)">
  <!-- legs + sneakers -->
  <g stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round">
    <rect x="212" y="318" width="22" height="46" rx="10" fill="#c47f3a"/>
    <rect x="280" y="318" width="22" height="46" rx="10" fill="#c47f3a"/>
    <path d="M190 360 h52 q10 0 10 12 v6 h-70 v-6 q0-12 8-12z" fill="#fff"/>
    <path d="M272 360 h52 q10 0 10 12 v6 h-70 v-6 q0-12 8-12z" fill="#fff"/>
  </g>
  <!-- donut -->
  <g mask="url(#hole)" stroke="#1a1a1a" stroke-width="10">
    <circle cx="256" cy="228" r="118" fill="url(#dough)"/>
    <path d="M150 212 q10-100 106-102 q104 6 114 104 q-18 26-30 6 q-14 28-34 4 q-16 30-36 2 q-18 28-38 0 q-20 30-36 0 q-18 28-34 -2 q-14 22-32 -8z" fill="url(#icing)"/>
  </g>
  <circle cx="256" cy="228" r="46" fill="none" stroke="#1a1a1a" stroke-width="10"/>
  <!-- sprinkles -->
  <g stroke-width="9" stroke-linecap="round">
    <line x1="180" y1="170" x2="194" y2="160" stroke="#3aa8ff"/><line x1="320" y1="160" x2="334" y2="172" stroke="#ffe03a"/>
    <line x1="200" y1="130" x2="214" y2="136" stroke="#fff"/><line x1="300" y1="128" x2="312" y2="138" stroke="#7dff5a"/>
    <line x1="345" y1="200" x2="352" y2="186" stroke="#fff"/><line x1="165" y1="205" x2="168" y2="190" stroke="#ff4a4a"/>
  </g>
  <!-- face: bandit mask behind the eyes -->
  <path d="M190 138 q66-22 132 0 l6 22 q-72 -16 -144 0z" fill="#1a1a1a"/>
  <g stroke="#1a1a1a" stroke-width="6">
    <ellipse cx="226" cy="150" rx="17" ry="20" fill="#fff"/><ellipse cx="286" cy="150" rx="17" ry="20" fill="#fff"/>
  </g>
  <circle cx="232" cy="154" r="8" fill="#1a1a1a"/><circle cx="292" cy="154" r="8" fill="#1a1a1a"/>
  <!-- sneaky grin -->
  <path d="M236 190 q20 16 40 0" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
  <!-- crown for flair -->
  <path d="M222 116 l10 -34 l24 24 l24 -24 l10 34z" fill="url(#gold)" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
</g>
  <!-- title -->
  <g font-family="Impact, 'Arial Black', 'DejaVu Sans', sans-serif" font-weight="900" text-anchor="middle" paint-order="stroke" stroke="#1a1a1a" stroke-linejoin="round">
    <text x="256" y="440" font-size="62" fill="#fff" stroke-width="16" transform="rotate(-4 256 440)">STEAL A</text>
    <text x="256" y="500" font-size="78" fill="url(#gold)" stroke-width="18" transform="rotate(-4 256 500)">DONUT!</text>
  </g>
</svg>
